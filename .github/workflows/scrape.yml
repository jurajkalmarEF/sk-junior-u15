name: Sync Sportnet data

on:
  schedule:
    # každý deň o 6:00 miestneho času (Bratislava) — dva UTC varianty kvôli letnému/zimnému času,
    # strážny krok nižšie pustí ďalej len ten, ktorý naozaj zodpovedá 6:00 v Bratislave
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    # sobota navyše o 12:00, 14:00 a 17:00 miestneho času — opäť po dvoch UTC variantoch kvôli DST
    - cron: '0 10 * * 6'
    - cron: '0 11 * * 6'
    - cron: '0 12 * * 6'
    - cron: '0 13 * * 6'
    - cron: '0 15 * * 6'
    - cron: '0 16 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard pre duplicitné DST spustenia
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          EXPECTED=""
          case "$SCHEDULE" in
            "0 4 * * *"|"0 5 * * *") EXPECTED="06" ;;
            "0 10 * * 6"|"0 11 * * 6") EXPECTED="12" ;;
            "0 12 * * 6"|"0 13 * * 6") EXPECTED="14" ;;
            "0 15 * * 6"|"0 16 * * 6") EXPECTED="17" ;;
          esac

          if [ -n "$EXPECTED" ]; then
            HOUR=$(TZ='Europe/Bratislava' date +%H)
            echo "Aktuálna hodina v Bratislave: $HOUR (očakávané: $EXPECTED)"
            if [ "$HOUR" != "$EXPECTED" ]; then
              echo "Toto je ten druhý DST variant, preskakujem."
              echo "SKIP=true" >> "$GITHUB_ENV"
            fi
          fi

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: npm install

      - name: Install Playwright browser
        if: env.SKIP != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        if: env.SKIP != 'true'
        run: npm run scrape

      - name: Commit updated data
        if: env.SKIP != 'true'
        run: |
          git config user.name "ivanka-u15-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Žiadna zmena v dátach." || git commit -m "chore: sync dát zo Sportnetu [automaticky]"
          git push
